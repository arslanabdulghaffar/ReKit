name: ReKit CPU checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Python backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Check Python dependencies
        run: python -m pip check
      - name: Run backend tests
        run: python -m pytest -q -W error

  frontend:
    name: TypeScript operator workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.3.1'
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check frontend dependency graph
        run: npm ls --all
      - name: Run component tests
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build frontend
        run: npm run build

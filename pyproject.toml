[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rekit"
version = "0.1.0"
description = "AMD-powered multimodal product-return recovery system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["backend/src"]
include = ["rekit*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
addopts = "--import-mode=importlib"
